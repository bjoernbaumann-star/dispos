  if(it.k==="bar"){el.className="it bar";el.innerHTML='<b class="t"></b> / <span>'+esc(it.t)+'</span>'+ctl}
  else{
    el.className="it row"+(it.ton?" ton":"");
    let pic="";
    if(it.vid)pic='<video src="'+DATA.vid[it.vid]+'" poster="'+(it.img?DATA.img[it.img]:"")+'" autoplay muted loop playsinline aria-label="'+esc(it.sid)+'"></video>';
    else if(it.img)pic='<img src="'+DATA.img[it.img]+'" alt="'+esc(it.sid)+'">';
    el.innerHTML='<div class="sid">'+esc(it.sid)+'</div><div class="tm"></div><div class="ds">'+(it.desc?"<small>"+esc(it.desc)+"</small>":"")+"<strong>"+esc(it.cast)+"</strong><span>"+esc(it.set)+'</span>'+ctl+'</div><div class="pic">'+pic+"</div>";
    const v=el.querySelector("video");if(v){const s=()=>{v.playbackRate=SPEED};v.addEventListener("loadedmetadata",s);v.addEventListener("play",s);s()}
  }
  el.querySelector(".chk").addEventListener("click",()=>toggleDone(it.id));
  return el;
}
DATA.items.forEach(it=>nodes[it.id]=build(it));
let times={};
function render(){
  times={};
  [1,2].forEach(u=>{
    const list=$("#u"+u);let t=START[u];
    state.order[u].forEach(id=>{
      const it=byId[id],el=nodes[id];if(el.parentNode!==list||list.lastElementChild!==el)list.appendChild(el);
      const s=t,e=t+it.d;times[id]={s,e,u};t=e;
      el.classList.toggle("done",!!state.done[id]);
      if(it.k==="bar")el.querySelector(".t").textContent=it.d?hm(s)+" - "+hm(e)+" / "+(it.d>=60?Math.floor(it.d/60)+"h"+(it.d%60?String(it.d%60)+"m":""):"0h"+it.d+"m"):hm(s);
      else el.querySelector(".tm").innerHTML="<b>"+hm(s)+"</b>"+(it.d?"<span>"+(it.d>=60?Math.floor(it.d/60)+"h"+(it.d%60||""):"0h"+it.d+"m")+"</span><b>"+hm(e)+"</b>":"");
    });
  });
  updNow();
}
function updNow(){
  document.querySelectorAll(".nowline").forEach(n=>n.remove());
  const d=new Date(),ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const btn=$("#jetzt");btn.hidden=true;if(ds!==DAY)return;
  const now=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;let first=null;
  [1,2].forEach(u=>{const id=state.order[u].find(id=>{const x=times[id];return x.e>x.s&&now>=x.s&&now<x.e});if(!id)return;const x=times[id];
    const n=document.createElement("div");n.className="nowline";n.style.top=((now-x.s)/(x.e-x.s)*100)+"%";n.innerHTML="<span>"+hm(Math.floor(now))+"</span>";nodes[id].appendChild(n);if(!first)first=n});
  if(first){btn.hidden=false;btn.onclick=()=>first.scrollIntoView({behavior:"smooth",block:"center"})}
}
setInterval(updNow,30000);
function setStatus(t){$("#status").textContent=t}
async function save(){
  if(!canWrite)return;
  const payload={order:{u1:state.order[1],u2:state.order[2]},done:state.done};
  try{const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","x-edit-key":editKey},body:JSON.stringify(payload)});
    if(r.status===401){canWrite=false;try{localStorage.removeItem(KEYNAME)}catch(e){};setEditing(false);setStatus("Passwort falsch");return}
    if(!r.ok)throw 0;const j=await r.json();lastRev=j.rev;setStatus("Gespeichert")}catch(e){setStatus("Speichern fehlgeschlagen")}
}
function toggleDone(id){if(!editing)return;if(state.done[id])delete state.done[id];else state.done[id]=true;render();save()}
const sortables=typeof Sortable==="undefined"?[]:[1,2].map(u=>Sortable.create($("#u"+u),{handle:".handle",animation:150,disabled:true,
  onStart(){dragging=true},
  onEnd(){dragging=false;state.order[u]=[...$("#u"+u).children].map(c=>c.dataset.id);render();save()}}));
function setEditing(on){editing=on;$("#app").classList.toggle("edit-off",!on);$("#editBtn").classList.toggle("on",on);$("#editBtn").textContent=on?"Fertig":"Bearbeiten";$("#resetBtn").hidden=!on;sortables.forEach(s=>s.option("disabled",!on))}
$("#editBtn").addEventListener("click",()=>setEditing(!editing));
let resetArmed=false;
$("#resetBtn").addEventListener("click",()=>{
  if(!resetArmed){resetArmed=true;$("#resetBtn").textContent="Wirklich zurücksetzen?";setTimeout(()=>{resetArmed=false;$("#resetBtn").textContent="Reihenfolge zurücksetzen"},4000);return}
  resetArmed=false;$("#resetBtn").textContent="Reihenfolge zurücksetzen";state.order={1:[...DEFAULT[1]],2:[...DEFAULT[2]]};state.done={};render();save()});
render();
let lastRev=-1;
function apply(d){if(dragging||!d||d.rev===lastRev)return;lastRev=d.rev;state.order={1:normalize(d.order&&d.order.u1,1),2:normalize(d.order&&d.order.u2,2)};state.done=Object.assign({},d.done||{});render()}
async function poll(){try{const r=await fetch(API,{cache:"no-store"});if(r.ok){apply(await r.json());if(!editing)setStatus("Live")}}catch(e){setStatus("Offline – zeigt letzten Stand")}}
poll();setInterval(poll,8000);
$("#editBtn").hidden=false;
$("#editBtn").addEventListener("click",async e=>{
  if(canWrite)return;e.stopImmediatePropagation();
  const box=$("#pw");box.hidden=false;$("#pwIn").focus();
},true);
$("#pwForm").addEventListener("submit",async e=>{e.preventDefault();const k=$("#pwIn").value.trim();if(!k)return;
  const r=await fetch(API,{method:"POST",headers:{"content-type":"application/json","x-edit-key":k},body:JSON.stringify({check:true})});
  if(r.ok){editKey=k;canWrite=true;try{localStorage.setItem(KEYNAME,k)}catch(e){};$("#pw").hidden=true;setEditing(true);setStatus("Bearbeiten")}
  else{$("#pwMsg").textContent="Passwort stimmt nicht."}});
try{const k=localStorage.getItem(KEYNAME);if(k){editKey=k;canWrite=true}}catch(e){}
</script>
</body></html>
